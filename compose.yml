# GalviTracks no servidor na nuvem: app + HTTPS (Caddy) + backup diário.
# Passo a passo em docs/nuvem.md. Subir/atualizar: docker compose up -d --build

services:
  app:
    build: .
    image: galvitracks:latest
    restart: unless-stopped
    env_file: .env.nuvem
    environment:
      ACESSO_PAINEL_INTERNET: "1"   # painel pela internet, sempre com login
      COOKIE_SEGURO: "1"            # cookie de sessão só por HTTPS
      # O Caddy chega pela rede interna do Docker: é dele o X-Forwarded-For confiável
      PROXIES_CONFIAVEIS: "127.0.0.1,::1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
      PASTA_DADOS: /app/data
      TZ: America/Sao_Paulo
    volumes:
      - ./data:/app/data
      - ./config/motoboys.json:/app/config/motoboys.json:ro
    expose:
      - "5000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  backup:
    image: galvitracks:latest
    restart: unless-stopped
    command: ["python", "scripts/backup_banco.py", "--loop", "--manter", "14"]
    environment:
      PASTA_DADOS: /app/data
      TZ: America/Sao_Paulo
    volumes:
      - ./data:/app/data
    depends_on:
      - app
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "2" }

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    env_file: .env.nuvem
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
